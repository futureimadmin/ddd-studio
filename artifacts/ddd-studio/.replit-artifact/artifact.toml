kind = "web"
previewPath = "/"
title = "DDD Studio"
description = "A domain-driven design IDE for modeling bounded contexts, aggregates, relationships, event storming, repositories, services, and database schemas across Oracle, DB2, MySQL, and PostgreSQL."
version = "1.0.0"
id = "artifacts/ddd-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20401

[services.development]
run = "pnpm --filter @workspace/ddd-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ddd-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ddd-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20401"
BASE_PATH = "/"
